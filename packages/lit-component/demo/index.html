<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      :root {
        color-scheme: light dark;
        color: #1a1a1a;
        background: #fafafa;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color: #213547;
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>Default</legend>
      <my-custom-element></my-custom-element>
    </fieldset>

    <fieldset>
      <legend>with custom header</legend>
      <my-custom-element header="Custom Header">some light-dom</my-custom-element>
    </fieldset>

    <script type="module">
      import '../dist/src/my-custom-element.js';
    </script>
  </body>
</html>
